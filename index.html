<style>
  @layer base {
    body { overscroll-behavior: none; }
  }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1c5b4; border-radius: 9999px; }
  body.login-shell {
    background-color: #F8F5F0; color: #1F1E1D;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  /* Royale login palette (dari login_kasir_gym) */
  .bg-royale-gold { background-color: #C5A059; }
  .hover\:bg-royale-gold:hover { background-color: #C5A059; }
  .hover\:bg-royale-gold-hover:hover { background-color: #b38f49; }
  .bg-royale-gold-light { background-color: #FDF9F3; }
  .bg-royale-gold\/15 { background-color: rgba(197,160,89,0.15); }
  .bg-royale-gold\/10 { background-color: rgba(197,160,89,0.10); }
  .border-royale-gold { border-color: #C5A059; }
  .border-royale-gold\/20 { border-color: rgba(197,160,89,0.20); }
  .border-royale-gold\/30 { border-color: rgba(197,160,89,0.30); }
  .border-royale-border { border-color: #EDE8E0; }
  .border-2 { border-width: 2px; }
  .bg-royale-cream { background-color: #FBF9F5; }
  .bg-royale-dark { background-color: #1F1E1D; }
  .text-royale-gold { color: #C5A059; }
  .text-royale-dark { color: #1F1E1D; }
  .text-royale-gray { color: #787570; }
  .hover\:text-royale-dark:hover { color: #1F1E1D; }
  .hover\:text-royale-gold:hover { color: #C5A059; }
  .shadow-royale-gold\/30 { box-shadow: 0 2px 8px rgba(197,160,89,0.30); }
  .shadow-royale-gold\/25 { box-shadow: 0 4px 14px rgba(197,160,89,0.25); }
  .ring-royale-gold\/20 { box-shadow: 0 0 0 4px rgba(197,160,89,0.20); }
  .shadow-warm-sm { box-shadow: 0 2px 8px rgba(197,160,89,0.08); }
  .shadow-warm-md { box-shadow: 0 6px 20px rgba(70,50,20,0.06); }
  .shadow-warm-lg { box-shadow: 0 12px 32px rgba(197,160,89,0.12); }
  .hover\:border-royale-gold\/60:hover { border-color: rgba(197,160,89,0.60); }
  .focus\:border-royale-gold:focus { border-color: #C5A059; }
  .focus\:ring-royale-gold:focus { box-shadow: 0 0 0 2px #C5A059; }
  .pulse-dot { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); animation: pulse-ring 2s infinite; }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
    70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }
  .scanner-line {
    background: linear-gradient(180deg, rgba(197,160,89,0) 0%, rgba(197,160,89,0.85) 50%, rgba(197,160,89,0) 100%);
    animation: scan 2.4s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  @keyframes scan {
    0% { top: 10%; opacity: 0.3; } 50% { top: 75%; opacity: 1; } 100% { top: 10%; opacity: 0.3; }
  }
  /* SPA shell */
  #app-root { display: contents; }
  .view { display: none; }
  .view.active { display: flex; }
  .view.is-login { display: none; }
  .view.is-login.active { display: block; }
  .view.is-login.active > div { min-height: 100vh; }
  #shell-splash { position: fixed; inset: 0; z-index: 100; background: #fff8f1; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
  #shell-splash.fade-out { opacity: 0; pointer-events: none; }
  .nav-link { cursor: pointer; }
  .view img, .view video { max-width: 100%; }

  /* ============================================================
   * RESPONSIVE & TAB-FRIENDLY
   * - sidebar statik (sticky) di desktop, drawer di <= 1023px
   * - grid konten menumpuk vertikal di layar sempit
   * - target sentuh membesar di pointer kasar (tablet)
   * ============================================================ */
  .rg-burger, .rg-close, .rg-scrim { display: none; }
  .view .rg-sidebar { position: sticky; top: 0; height: 100vh; align-self: flex-start; flex: none; }
  .view :focus-visible { outline: 2px solid #775a19; outline-offset: 2px; }
  button, a, input, select, textarea { touch-action: manipulation; }

  /* tablet & lebih kecil: sidebar jadi drawer */
  @media (max-width: 1023px) {
    .view .rg-sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 80;
      width: 264px; max-width: 86vw; height: auto !important; min-height: 100vh;
      transform: translateX(-106%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 12px 36px rgba(30,27,23,.22);
    }
    .view .rg-sidebar.open { transform: translateX(0); }
    .view .rg-scrim {
      display: block; position: fixed; inset: 0; z-index: 75;
      background: rgba(30,27,23,.38);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .view .rg-scrim.show { opacity: 1; pointer-events: auto; }
    .view .rg-burger, .view .rg-close { display: inline-flex; }
    .view .rg-hide-md { display: none !important; }
    .view .nav-link { min-height: 48px !important; padding-top: 12px !important; padding-bottom: 12px !important; font-size: 13px !important; }
    .view .nav-link svg { width: 18px !important; height: 18px !important; }
  }

  /* layar sedang: KPI 4 -> 2 kolom */
  @media (max-width: 1079px) {
    .view .grid-cols-4:not(.gap-2\.5) { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  }

  /* mobile: konten utama di-stack vertikal */
  @media (max-width: 860px) {
    .view .grid-cols-12 { grid-template-columns: 1fr !important; }
    .view .col-span-7, .view .col-span-5, .view .col-span-8, .view .col-span-4 { grid-column: 1 / -1 !important; }
    .view .flex-1.flex.gap-3.overflow-hidden { flex-wrap: wrap; }
    .view section.flex-\[1\.6\], .view section.flex-1 { flex: 1 1 100% !important; min-width: 0; }
    .view .h-full { height: auto !important; }
  }

  @media (max-width: 620px) {
    .view .grid-cols-4:not(.gap-2\.5) { grid-template-columns: 1fr !important; }
    .view .grid-cols-3:not([data-purpose="numpad"]) { grid-template-columns: 1fr !important; }
    .view .rg-hide-sm { display: none !important; }
    .view header, .view footer { padding-inline: 1rem !important; }
    .view .px-6 { padding-inline: 1rem !important; }
    .view header[data-purpose="app-header"] { flex-wrap: wrap; row-gap: 8px; }
  }

  @media (max-width: 480px) {
    .view .rg-hide-xs { display: none !important; }
  }
</style>
<meta content="web_dashboard" name="shell-type"/>
</head>
